const initial=[
{id:'filter',title:'Replace HVAC air filter',category:'Home maintenance',owner:'Alex',due:'2026-09-23',planned:'2026-09-20',repeat:'Every 3 months',description:'Replace the downstairs air filter and check the date on the spare. The filter size and system details are in the House Binder.',steps:['Check the size printed on the existing filter.','Replace the filter following the system instructions.','Write the replacement date on the new filter.'],binder:'HVAC',updates:[{name:'Jordan',time:'Yesterday at 7:42 PM',text:'There’s a spare filter on the shelf in the utility room.'}],completed:false},
{id:'recycling',title:'Take out recycling',category:'Recurring chore',owner:'Jordan',due:'2026-09-21',planned:'2026-09-20',repeat:'Every Sunday',description:'Put the blue bin at the curb this evening. Collection is Monday morning.',steps:[],updates:[],completed:false},
{id:'groceries',title:'Pick up groceries',category:'Errand',owner:'Alex',due:'',planned:'2026-09-20',repeat:'Does not repeat',description:'Pick up milk, coffee, and the ingredients for Tuesday’s dinner.',steps:[],updates:[],completed:false},
{id:'electrician',title:'Schedule electrician visit',category:'Update kitchen lighting',owner:'Alex',due:'2026-09-29',planned:'',repeat:'Does not repeat',description:'Arrange a visit to check the kitchen lighting and discuss the new fittings.',steps:[],paused:'Waiting for the electrician to return our call.',updates:[{name:'Alex',time:'Friday at 10:15 AM',text:'Left a message. They expect to call us back early next week.'}],completed:false}
];
let tasks=structuredClone(initial),mode='panel',selected='filter',editing=false,draft=null,editPolicy='here',binderOpen=false,pendingNavigation=null,busy=false;
const app=document.getElementById('app');let toastTimer;

function refreshEditIndicators(){
  const unsaved=dirty();
  const text=busy?'Saving…':unsaved?'Unsaved changes':'No changes yet';
  document.querySelectorAll('[data-draft-state],[data-save-state]').forEach(el=>{if(el.textContent!==text)el.textContent=text});
  document.querySelectorAll('.save-state').forEach(el=>el.classList.toggle('is-dirty',unsaved));
  document.querySelectorAll('[data-row-state]').forEach(el=>{const label=editing?'Editing'+(unsaved?' · Unsaved changes':''):'Viewing';if(el.textContent!==label)el.textContent=label});
}

function task(){return tasks.find(t=>t.id===selected)}
function initials(name){return name.slice(0,1)+(name==='Jordan'?'S':'T')}
function date(v){return v?new Date(v+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'Not set'}
function dirty(){return editing&&JSON.stringify(draft)!==JSON.stringify(task())}
function communicate(){}

function closeTask(){guarded(()=>{const previous=selected;selected=null;editing=false;draft=null;binderOpen=false;referenceHistory.pushState({task:null},'','#today');render();document.querySelector(`[data-action="open"][data-id="${previous}"]`)?.focus()})}
function focusTitle(){document.querySelector('#detail-heading')?.focus({preventScroll:true})}

function renderList(){return `<section class="today" aria-label="Today’s tasks"><h1>Today</h1><p class="day">Sunday, September 20</p>${group('For today',tasks.filter(t=>t.id!=='electrician'&&!t.completed),'sun')}${group('Upcoming',tasks.filter(t=>t.id==='electrician'&&!t.completed),'calendar')}<p class="helpercaption">All caught up is a little closer.</p></section>`}
function group(title,items,symbol){return '<div class="listheading">'+icon(symbol)+'<h3>'+title+'</h3><span class="count">'+items.length+'</span></div><ul class="tasklist">'+(items.length?items.map(t=>{
  const current=selected===t.id;
  const state=editing?'Editing':'Viewing';
  const rowLabel=state+(editing&&dirty()?' · Unsaved changes':'');
  return '<li class="taskrow '+(current?'selected':'')+'"><button class="rowcheck '+(t.paused?'lock':'')+'" data-action="row-complete" data-id="'+t.id+'" aria-label="'+(t.paused?'Paused: '+esc(t.paused):'Complete '+esc(t.title))+'" '+(t.paused||(current&&editing)||busy?'disabled':'')+'>'+ (t.paused?icon('lock'):'')+'</button><button class="taskopen" data-action="open" data-id="'+t.id+'" '+(current?'aria-current="true" aria-controls="task-detail-panel"':'')+'><span class="taskname">'+esc(t.title)+'</span><span class="taskcontext">'+esc(t.category)+'</span><span class="tasktime">'+(t.planned?'Planned '+date(t.planned):'Due '+date(t.due))+(t.due&&t.planned?' · Due '+date(t.due):'')+'</span>'+(t.paused?'<span class="pausedline">Paused · Waiting for a call</span>':'')+(current?'<span class="row-status">'+icon(editing?'edit':'tasks')+'<span data-row-state>'+rowLabel+'</span><span class="row-direction">'+icon('chevron')+'</span></span>':'')+'</button><span class="avatar" title="'+esc(t.owner)+'">'+initials(t.owner)+'</span></li>';
}).join(''):'<li class="empty">Nothing else here. Enjoy the breathing room.</li>')+'</ul>'}
function shell(content){return `<div class="shell"><aside class="nav"><div class="brand">H<span class="brandtail">omeOps</span></div><nav class="navitems" aria-label="Main navigation"><div class="navitem active">${icon('sun')}<span>Today</span></div><div class="navitem">${icon('tasks')}<span>Tasks</span></div><div class="navitem">${icon('calendar')}<span>Calendar</span></div><div class="navitem">${icon('home')}<span>Household</span></div><div class="navitem">${icon('folder')}<span>Projects</span></div></nav><div class="navbottom">A little more together.</div></aside><div class="app"><header class="appbar"><div class="household">${icon('home')}<span>Anderson Household</span></div><div class="bar-right"><span class="searchhint">${icon('search')}Search your household</span><span class="avatar" title="Alex">AT</span></div></header>${content}</div></div>`}
function guardMarkup(){return pendingNavigation?'<div class="guard" role="alert"><p>You have unsaved changes to <strong>'+esc(task().title)+'</strong>.</p><div class="actions"><button id="keep-editing" class="button primary" data-action="keep">Keep editing</button><button class="button" data-action="discard">Discard changes</button></div></div>':''}
function detail(){const t=task();if(!t)return '';return '<section class="detail" id="task-detail-panel" aria-labelledby="detail-heading"><div class="detailbar">'+(mode==='page'?'<button class="quiet" data-action="close">'+icon('arrow')+'Back to Today</button>':'<span class="label desktopclose">From Today</span><button class="quiet mobileback" data-action="close">'+icon('arrow')+'Today</button>')+'<div class="actions">'+(mode!=='page'?'<button class="iconbutton desktopclose" data-action="close" aria-label="Close task details">'+icon('close')+'</button>':'')+'</div></div><header class="context-header"><div class="context-status">'+icon(editing?'edit':'tasks')+'<span>'+(editing?'Editing task':'Viewing task')+'</span>'+(editing?'<span class="context-separator">·</span><span data-draft-state>'+(dirty()?'Unsaved changes':'No changes yet')+'</span>':'')+'</div><h2 id="detail-heading" tabindex="-1">'+esc(t.title)+'</h2><p class="context-category">'+esc(t.category)+'</p></header><div class="detailcontent">'+guardMarkup()+(binderOpen?binderView(t):editing?editView(t):readView(t))+'</div>'+(editing?'<footer class="editing-footer"><span class="save-state" role="status" aria-live="polite"><span class="state-dot" aria-hidden="true"></span><span data-save-state></span></span><div class="actions"><button type="button" class="button" data-action="cancel" '+(busy?'disabled':'')+'>Cancel</button><button type="submit" form="edit-form" class="button primary" '+(busy?'disabled':'')+'>'+(busy?'Saving…':'Save changes')+'</button></div></footer>':'')+'</section>'}
function facts(t){return `<dl class="facts"><div class="fact"><dt>Assigned to</dt><dd><span class="avatar">${initials(t.owner)}</span>${esc(t.owner)}</dd></div><div class="fact"><dt>Planned for</dt><dd>${date(t.planned)}</dd></div><div class="fact"><dt>Due by</dt><dd>${date(t.due)}</dd></div><div class="fact"><dt>Repeats</dt><dd>${esc(t.repeat)}</dd></div></dl>`}
function readView(t){return `<div class="title-area"><div class="detailactions"><button class="button ${t.completed?'':'primary'}" data-action="complete" ${busy||t.paused?'disabled':''}>${icon(t.paused?'lock':'check')}${busy?'Saving…':t.completed?'Completed · Undo':t.paused?'Completion paused':'Mark complete'}</button><button class="button" data-action="edit">${icon('edit')}Edit task</button></div>${t.paused?`<div class="notice"><strong>Paused</strong>${esc(t.paused)}</div>`:''}${t.completed?'<div class="notice success"><strong>Task completed</strong>This task has left Today. You can still review its details or undo completion.</div>':''}</div><div class="detailbody">${facts(t)}<div class="body-main"><section class="section"><h3>What needs doing</h3><p>${esc(t.description||'No instructions added yet.')}</p>${t.steps.length?`<ol class="instructions">${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}</section>${t.binder?`<section class="section"><h3>Useful information</h3><button class="binderlink" data-action="binder">${icon('book')}<span><strong>${esc(t.binder)} · House Binder</strong><small>Filter size, system details, and household notes</small></span>${icon('chevron')}</button></section>`:''}<section class="section"><h3>Updates</h3>${t.updates.map(u=>`<div class="update"><span class="avatar">${initials(u.name)}</span><div class="update-content"><div class="updatemeta"><strong>${esc(u.name)}</strong> · ${esc(u.time)}</div><p>${esc(u.text)}</p></div></div>`).join('')}${!t.updates.length?'<p class="helpercaption">Leave a useful detail for the next person.</p>':''}<form id="update-form" class="composer"><label class="field"><span class="updatemeta">Add an update</span><textarea name="update" aria-label="Add an update" placeholder="Share something useful…" required></textarea></label><button class="button" type="submit">Post update</button></form></section></div></div>`}
function editView(t){const d=draft;return `<form id="edit-form" class="editform"><label class="field">Task name<input name="title" value="${esc(d.title)}" required maxlength="180"></label><label class="field">What needs doing<textarea name="description" rows="4">${esc(d.description)}</textarea></label><div class="formgrid"><label class="field">Assigned to<select name="owner">${['Alex','Jordan'].map(n=>`<option ${d.owner===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Repeats<select name="repeat">${['Does not repeat','Every Sunday','Every 3 months'].map(n=>`<option ${d.repeat===n?'selected':''}>${n}</option>`).join('')}</select></label><label class="field">Planned for<input name="planned" type="date" value="${d.planned}"></label><label class="field">Due by<input name="due" type="date" value="${d.due}"></label></div>${d.steps.length?`<label class="field">Steps <span class="updatemeta">One step per line</span><textarea name="steps" rows="4">${esc(d.steps.join('\n'))}</textarea></label>`:''}${d.paused?`<label class="field">Why it’s paused<textarea name="paused" rows="2">${esc(d.paused)}</textarea></label>`:''}</form>`}
function binderView(t){return `<button class="quiet" data-action="binder-back">${icon('arrow')}Back to task</button><div class="section"><p class="eyebrow">House Binder</p><h3>${esc(t.binder)}</h3><p style="margin-top:16px">The household’s reference for the heating and cooling system.</p><dl class="facts"><div class="fact"><dt>Filter size</dt><dd>16 × 25 × 1 in</dd></div><div class="fact"><dt>Location</dt><dd>Utility room</dd></div></dl></div><section class="section"><h3>Household notes</h3><p>Spare filters are stored on the shelf beside the system. Keep the size label from the old filter when buying replacements.</p></section>`}
function render(){const old=document.getElementById('task-dialog');if(old?.open)old.close();const shown=Boolean(task());let content;if(mode==='page'&&shown){content=`<main class="pagewrap">${detail()}</main>`}else{content=`<main class="workspace ${mode==='panel'&&shown?'split':''}">${renderList()}${mode==='panel'&&shown?detail():''}</main>`}app.innerHTML=shell(content)+(mode==='modal'&&shown?`<dialog id="task-dialog" class="dialog" aria-labelledby="detail-heading">${detail()}</dialog>`:'');document.body.dataset.editing=String(editing);refreshEditIndicators();const dialog=document.getElementById('task-dialog');if(dialog){dialog.addEventListener('cancel',e=>{e.preventDefault();closeTask()});dialog.showModal()}communicate()}
async function complete(id){const t=tasks.find(x=>x.id===id);if(!t||t.paused||busy)return;if(t.completed){t.completed=false;render();notify('Task restored to Today');return}busy=true;render();await new Promise(r=>setTimeout(r,450));t.completed=true;busy=false;render();notify('Task completed',id)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='open')openTask(el.dataset.id);if(action==='close')closeTask();if(action==='edit'){draft=structuredClone(task());editing=true;binderOpen=false;if(editPolicy==='page')mode='page';render();document.querySelector('[name="title"]')?.focus()}if(action==='cancel'){editing=false;draft=null;pendingNavigation=null;render();focusTitle()}if(action==='complete')complete(selected);if(action==='row-complete')complete(el.dataset.id);if(action==='undo'){const t=tasks.find(x=>x.id===el.dataset.id);t.completed=false;document.getElementById('toast').hidden=true;render()}if(action==='binder'){binderOpen=true;render();focusTitle()}if(action==='binder-back'){binderOpen=false;render();focusTitle()}if(action==='keep'){pendingNavigation=null;render();document.querySelector('[name="title"]')?.focus()}if(action==='discard'){const next=pendingNavigation;pendingNavigation=null;editing=false;draft=null;next?.()}});
document.addEventListener('input',e=>{if(e.target.closest('#edit-form')&&draft){const field=e.target.name;draft[field]=field==='steps'?e.target.value.split('\n').filter(Boolean):e.target.value;refreshEditIndicators()}});
document.addEventListener('change',e=>{if(e.target.closest('#edit-form')&&draft){draft[e.target.name]=e.target.value;refreshEditIndicators()}});
document.addEventListener('submit',async e=>{if(e.target.id==='edit-form'){e.preventDefault();if(busy)return;busy=true;const saved=structuredClone(draft);saved.title=saved.title.trim();if(!saved.title){busy=false;return}render();await new Promise(r=>setTimeout(r,450));tasks[tasks.findIndex(t=>t.id===saved.id)]=saved;busy=false;editing=false;draft=null;pendingNavigation=null;render();focusTitle();notify('Changes saved')}if(e.target.id==='update-form'){e.preventDefault();const value=new FormData(e.target).get('update').trim();if(!value)return;task().updates.push({name:'Alex',time:'Just now',text:value});render();document.querySelector('[name="update"]')?.focus();notify('Update posted')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode==='panel'&&selected){e.preventDefault();closeTask()}});

window.addEventListener('popstate',e=>guarded(()=>{selected=e.state?.task||null;editing=false;draft=null;binderOpen=false;render()}));
referenceHistory.replaceState({task:selected},'','#task=filter');render();
</script></body></html>
