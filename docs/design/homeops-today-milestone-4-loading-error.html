<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeOps Today — Milestone 4 loading and error states</title>
  <style>
    :root {
      --ink: #17231f;
      --muted: #6f7974;
      --line: #dce2df;
      --paper: #fbfcfa;
      --panel: #ffffff;
      --green: #2f7667;
      --rust: #a44e3f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #202321;
      font-family: "Nunito Sans", system-ui, sans-serif;
    }

    .artifact {
      min-height: 100vh;
      padding: 32px;
    }

    .artifact-heading {
      max-width: 1500px;
      margin: 0 auto 24px;
      color: #f4f6f4;
    }

    .artifact-heading h1 {
      margin: 0;
      font: 650 28px/1.2 "Fraunces", Georgia, serif;
    }

    .artifact-heading p {
      margin: 8px 0 0;
      color: #aeb6b1;
    }

    .states {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .state {
      min-width: 0;
      overflow: hidden;
      border-radius: 14px;
      background: var(--paper);
    }

    .state-label {
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .today-page {
      min-height: 640px;
      padding: 34px 34px 46px;
      background: var(--paper);
    }

    .today-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 34px;
    }

    .today-page h2 {
      margin: 0;
      font: 650 38px/1.05 "Fraunces", Georgia, serif;
    }

    .date {
      display: block;
      margin-top: 5px;
      color: #8a6f38;
      font-size: 13px;
    }

    .button {
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: white;
      font: 700 14px/1 system-ui, sans-serif;
    }

    .add-button { padding: 12px 16px; }
    .retry-button { margin-top: 18px; padding: 12px 18px; }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 18px;
      font-weight: 750;
    }

    .section-icon { color: #9a7739; }

    .skeleton-list {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .skeleton-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 34px 74px 74px;
      align-items: center;
      gap: 13px;
      min-height: 78px;
      padding: 0 16px;
    }

    .skeleton-row + .skeleton-row { border-top: 1px solid var(--line); }

    .bone {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e7ece9 20%, #f3f5f3 48%, #e7ece9 76%);
      background-size: 220% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }

    .bone-box { width: 18px; height: 18px; border-radius: 5px; }
    .bone-avatar { width: 32px; height: 32px; border-radius: 50%; }
    .bone-title { width: min(78%, 230px); height: 12px; }
    .bone-subtitle { width: min(48%, 145px); margin-top: 9px; }
    .bone-fact { width: 62px; }
    .bone-fact.short { width: 48px; }
    .upcoming { margin-top: 31px; }

    .error-region {
      display: grid;
      min-height: 340px;
      place-items: center;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      text-align: center;
    }

    .error-icon {
      display: grid;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      place-items: center;
      border-radius: 50%;
      background: #f8ebe8;
      color: var(--rust);
      font-size: 24px;
      font-weight: 700;
    }

    .error-region h3 {
      margin: 0 0 7px;
      font: 650 21px/1.25 "Fraunces", Georgia, serif;
    }

    .error-region p {
      max-width: 320px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bone { animation: none; }
    }

    body[data-view] { background: var(--paper); }
    body[data-view] .artifact {
      position: fixed;
      inset: 0;
      overflow: hidden;
      padding: 0;
    }
    body[data-view] .artifact-heading { display: none; }
    body[data-view] .states { display: block; max-width: none; }
    body[data-view] .state { display: none; border-radius: 0; }
    body[data-view="loading"] .state-loading,
    body[data-view="error"] .state-error { display: block; }
    body[data-view] .state-label { display: none; }
    body[data-view] .today-page {
      width: min(980px, calc(100vw - 80px));
      min-height: 100vh;
      margin: 0 auto;
      padding-top: 64px;
    }

    @media (max-width: 900px) {
      .states { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="artifact">
    <header class="artifact-heading">
      <h1>Today loading and error states</h1>
      <p>Approved Milestone 4 visual reference</p>
    </header>

    <div class="states">
      <section class="state state-loading" aria-labelledby="loading-label">
        <div class="state-label" id="loading-label">Loading</div>
        <div class="today-page">
          <header class="today-top">
            <div>
              <h2>Today</h2>
              <span class="date">Friday, September 11</span>
            </div>
            <button class="button add-button">+&nbsp; Add task</button>
          </header>

          <div aria-label="Loading today's tasks">
            <div class="section-heading"><span class="section-icon">✦</span><span>For today</span></div>
            <div class="skeleton-list" aria-hidden="true">
              <div class="skeleton-row">
                <span class="bone bone-box"></span><div><div class="bone bone-title"></div><div class="bone bone-subtitle"></div></div><span class="bone bone-avatar"></span><span class="bone bone-fact"></span><span class="bone bone-fact short"></span>
              </div>
              <div class="skeleton-row">
                <span class="bone bone-box"></span><div><div class="bone bone-title" style="width:62%"></div><div class="bone bone-subtitle" style="width:35%"></div></div><span class="bone bone-avatar"></span><span class="bone bone-fact short"></span><span class="bone bone-fact"></span>
              </div>
              <div class="skeleton-row">
                <span class="bone bone-box"></span><div><div class="bone bone-title" style="width:71%"></div><div class="bone bone-subtitle" style="width:43%"></div></div><span class="bone bone-avatar"></span><span class="bone bone-fact"></span><span class="bone bone-fact short"></span>
              </div>
            </div>

            <div class="upcoming">
              <div class="section-heading"><span class="section-icon">□</span><span>Upcoming</span></div>
              <div class="skeleton-list" aria-hidden="true">
                <div class="skeleton-row">
                  <span class="bone bone-box"></span><div><div class="bone bone-title" style="width:74%"></div><div class="bone bone-subtitle"></div></div><span class="bone bone-avatar"></span><span class="bone bone-fact"></span><span class="bone bone-fact short"></span>
                </div>
                <div class="skeleton-row">
                  <span class="bone bone-box"></span><div><div class="bone bone-title" style="width:58%"></div><div class="bone bone-subtitle" style="width:38%"></div></div><span class="bone bone-avatar"></span><span class="bone bone-fact short"></span><span class="bone bone-fact"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="state state-error" aria-labelledby="error-label">
        <div class="state-label" id="error-label">Failure</div>
        <div class="today-page">
          <header class="today-top">
            <div>
              <h2>Today</h2>
              <span class="date">Friday, September 11</span>
            </div>
            <button class="button add-button">+&nbsp; Add task</button>
          </header>

          <div class="error-region" role="alert">
            <div>
              <div class="error-icon" aria-hidden="true">!</div>
              <h3>We couldn’t load today’s tasks</h3>
              <p>Your tasks haven’t changed. Check your connection and try again.</p>
              <button class="button retry-button">Try again</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const view = new URLSearchParams(window.location.search).get('state');
    if (view === 'loading' || view === 'error') {
      document.body.dataset.view = view;
    }
  </script>
</body>
</html>
